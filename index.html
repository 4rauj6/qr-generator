<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code generator (by João Victor "4rauj6" Araújo)</title>
    
    <link rel="stylesheet" href="qr-code.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="qr-code.js" defer></script>

</head>
<body>
    <section class="navegation-bar">
        <header class="navbar">
            <nav>
                <button class="navbar-opener">
                    <i class="fa fa-bars"></i>
                </button>
                <ul class="navbar-content">
                    <li>
                        <a href="">
                            <i class="fa-solid fa-house"></i> Home
                        </a>
                    </li>
                    <li>
                        <a href="#qr-generator-page" onclick="showQRPage()">
                            <i class="fa-solid fa-qrcode"></i> Create QR Code</a>
                    </li>
                    <li>
                        <a href="https://github.com/4rauj6">
                            <i class="fa-brands fa-github"></i> GitHub</a>
                    </li>

                    <li>
                        <a onclick="changeTheme()" id="theme-changer">
                            <i class="fa fa-toggle-off" aria-hidden="true"></i> Change theme
                        </a>
                    </li>
                </ul>
            </nav>
        </header>
    </section>
    <section class="main-page">
        <div class="main-container">
            <h1>
                myQR <i class="fa fa-qrcode" aria-hidden="true"></i>
            </h1>
            <h3>An easy way to make your links alive</h3>
            <p>Paste or type the URL and get your QR Code done in a second</p>
            <button onclick="showQRPage()">Get start</button>
        </div>
    </section>

    <section class="qr-generator-page">
        <div class="generator-container">
            <div class="inputs">
                <label for="url-input" class="label-class">Paste or type your URL:</label><br>
                <input type="text" id="url-input" name="url-input" placeholder="http://yourlink.com">

                <div class="qr-container">
                    <div id="qr-code-here"></div>
                </div>

                <button onclick="generateQr()">Generate
                    <i class="fa-solid fa-qrcode"></i>
                </button>
            </div>
        </div>
    </section>
</body>
</html>
